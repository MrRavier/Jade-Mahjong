name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.18f1
          testMode: EditMode
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: test-artifacts

  apk:
    name: Build native APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.18f1
          targetPlatform: Android
          buildMethod: JadeMahjong.Editor.JadeBuild.BuildAndroidFromCommandLine
          androidExportType: androidPackage
          customParameters: -customBuildPath build/Android/Jade-Mahjong.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jade-Mahjong-APK
          path: build/Android/*.apk
